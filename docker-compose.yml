services:
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CLASSIFY_TIMEOUT_SECONDS: ${CLASSIFY_TIMEOUT_SECONDS:-8}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-test:
    build:
      context: ./backend
    environment:
      OPENAI_API_KEY: dummy
      OPENAI_MODEL: gpt-4o-mini
      CLASSIFY_TIMEOUT_SECONDS: "8"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: dummy
      SUPABASE_ANON_KEY: dummy
      SUPABASE_JWT_SECRET: dummy
      AUTH_ENABLED: "false"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    profiles:
      - test

  api-smoke:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CLASSIFY_TIMEOUT_SECONDS: ${CLASSIFY_TIMEOUT_SECONDS:-8}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
    command: ["python", "smoke_test.py", "--base-url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - smoke
